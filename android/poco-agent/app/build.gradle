plugins { id 'com.android.application' }

android {
    namespace 'br.com.jarviscerrado.poco'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'br.com.jarviscerrado.poco'
        minSdk 31
        targetSdk 35
        // Cada APK diferente recebe versionCode proprio — reutilizar o mesmo
        // numero para binario distinto apagava a rastreabilidade do que esta de
        // fato instalado no aparelho. 33 / 1.0.1: religamento por
        // MY_PACKAGE_REPLACED. 34 / 1.0.2: segundo caminho de religamento pelo
        // rebind da acessibilidade, e versionCode no heartbeat. 35 / 1.0.3:
        // evidencia persistente da ponte. 36 / 1.0.4: espera do funil de
        // debitos baseada em mudança de etapa, não em animação do DOM. 37 /
        // 1.0.5: inventário seguro, UI operacional e recuperação limitada de
        // recargas transitórias do formulário da Equatorial.
        versionCode 37
        versionName '1.0.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Variante bundled: o modelo vai dentro do APK. A alternativa
    // (play-services-mlkit-barcode-scanning) baixa o modelo na primeira leitura,
    // e a primeira leitura e justamente quando o proprietario esta esperando o
    // Pix — falhar ali por download de modelo seria falhar sem motivo.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    testImplementation 'junit:junit:4.13.2'
}
