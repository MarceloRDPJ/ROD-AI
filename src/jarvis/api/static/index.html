<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ROD do Cerrado</title>
  <style>
    :root{--bg:#08110e;--panel:#102019;--line:#284437;--text:#e8f4ed;--muted:#91aa9d;--green:#57d68d;--amber:#f2bf62;--red:#ff7676}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173326 0,var(--bg) 48%);color:var(--text);font:15px/1.45 system-ui,sans-serif}
    main{width:min(1050px,92vw);margin:0 auto;padding:28px 0 50px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
    h1{font-size:clamp(1.5rem,4vw,2.3rem);margin:0}h2{font-size:1rem;margin:0 0 14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .subtitle,.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%;background:var(--amber)}
    .ok .dot{background:var(--green);box-shadow:0 0 12px var(--green)}.bad .dot{background:var(--red)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
    .card,.section{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 12px 35px #0005}
    .value{font-size:1.8rem;font-weight:750;margin-top:6px}.section{margin-top:16px}.actions{display:flex;flex-wrap:wrap;gap:9px}
    button{border:1px solid var(--line);background:#183527;color:var(--text);padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:650}
    button:hover{border-color:var(--green)}button.secondary{background:transparent}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#cce3d5;margin:0;max-height:340px;overflow:auto}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
    @media(max-width:600px){header{align-items:flex-start;flex-direction:column}.value{font-size:1.45rem}}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>ROD do Cerrado</h1><div class="subtitle">Raspberry Pi 3B · skills locais · sem IA generativa</div></div>
    <div id="service" class="status"><span class="dot"></span><span>Verificando</span></div>
  </header>

  <section class="grid">
    <article class="card"><span class="muted">CPU</span><div class="value" id="cpu">--</div></article>
    <article class="card"><span class="muted">RAM</span><div class="value" id="ram">--</div></article>
    <article class="card"><span class="muted">Temperatura</span><div class="value" id="temp">--</div></article>
    <article class="card"><span class="muted">Disco SSD</span><div class="value" id="disk">--</div></article>
    <article class="card"><span class="muted">Internet</span><div class="value" id="internet">--</div></article>
    <article class="card"><span class="muted">Uptime do Pi</span><div class="value" id="uptime">--</div></article>
  </section>

  <section class="section">
    <h2>Diagnóstico</h2>
    <div class="actions">
      <button onclick="refresh()">Atualizar painel</button>
      <button onclick="ping()">Testar internet</button>
      <button onclick="speed()">Medir velocidade no Pi</button>
      <button onclick="scan()">Varrer rede</button>
      <button class="secondary" onclick="logout()">Sair</button>
    </div>
    <pre id="result" style="margin-top:16px">Pronto.</pre>
  </section>

  <section class="section">
    <h2>Eventos recentes</h2>
    <div style="overflow:auto"><table><thead><tr><th>Horário</th><th>Evento</th><th>Origem</th></tr></thead><tbody id="events"></tbody></table></div>
  </section>
</main>
<script>
  let csrf = "";
  const fmtBytes = n => n == null ? "--" : (n / 1073741824).toFixed(1) + " GiB";
  const fmtUptime = s => {
    if (s == null) return "--";
    const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);
    return (d?d+"d ":"")+h+"h "+m+"m";
  };
  async function api(path, options={}) {
    options.headers={...(options.headers||{}),...(csrf?{"X-CSRF-Token":csrf}:{})};
    const response=await fetch(path,options);
    if(response.status===401){location.href="/login";throw new Error("Sessão expirada");}
    if(!response.ok) throw new Error((await response.json().catch(()=>({}))).detail||"Falha HTTP "+response.status);
    return response.json();
  }
  function show(value){document.getElementById("result").textContent=typeof value==="string"?value:JSON.stringify(value,null,2)}
  async function auth(){const s=await api("/api/auth/status");csrf=s.csrf_token||""}
  async function refresh(){
    try{
      const [health,data,events]=await Promise.all([api("/api/system/health"),api("/api/dashboard"),api("/api/events/recent?limit=12")]);
      const sys=data.system||{},mem=sys.memory||{},disk=sys.disk||{},net=data.internet||{};
      document.getElementById("cpu").textContent=(sys.cpu_percent??"--")+"%";
      document.getElementById("ram").textContent=(mem.percent??"--")+"%";
      document.getElementById("temp").textContent=sys.temperature_c==null?"N/A":sys.temperature_c+" °C";
      document.getElementById("disk").textContent=(disk.percent??"--")+"% · "+fmtBytes(disk.free)+" livres";
      document.getElementById("internet").textContent=net.success?(net.latency_ms??"--")+" ms":"offline";
      document.getElementById("uptime").textContent=fmtUptime(sys.uptime_seconds);
      const service=document.getElementById("service");service.className="status "+(health.status==="ok"?"ok":"bad");service.lastElementChild.textContent=health.status==="ok"?"Operacional":"Falha";
      document.getElementById("events").innerHTML=(events.events||[]).map(e=>"<tr><td>"+escapeHtml((e.timestamp||"").slice(0,19))+"</td><td>"+escapeHtml(e.type||"")+"</td><td>"+escapeHtml(e.source||"")+"</td></tr>").join("")||"<tr><td colspan=3>Nenhum evento.</td></tr>";
    }catch(e){show(e.message)}
  }
  const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  async function ping(){try{show(await api("/api/network/ping"))}catch(e){show(e.message)}}
  async function speed(){show("Medição em andamento. O Ethernet do Pi 3B é limitado a 100 Mbps.");try{show(await api("/api/network/speedtest"))}catch(e){show(e.message)}}
  async function scan(){show("Varrendo a rede local...");try{show(await api("/api/network/scan?depth=standard"))}catch(e){show(e.message)}}
  async function logout(){try{await api("/api/auth/logout",{method:"POST"})}finally{location.href="/login"}}
  auth().then(refresh);setInterval(refresh,30000);
</script>
</body>
</html>
