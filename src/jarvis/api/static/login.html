<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'none'">
    <title>ROD do Cerrado — Acesso</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071014; color: #e9fbf2; }
        main { width: min(92vw, 390px); padding: 30px; border: 1px solid #1e6049; border-radius: 18px; background: #0c1a1f; box-shadow: 0 18px 70px #0009; }
        h1 { margin: 0 0 6px; color: #54e6a0; font-size: 1.65rem; }
        p { color: #a8c2b8; margin: 0 0 24px; }
        label { display: block; margin: 15px 0 6px; font-size: .9rem; }
        input, button { width: 100%; min-height: 44px; border-radius: 9px; font: inherit; }
        input { border: 1px solid #31534a; background: #071014; color: white; padding: 9px 11px; }
        input:focus { outline: 2px solid #54e6a0; outline-offset: 1px; }
        button { margin-top: 22px; border: 0; background: #2bd184; color: #04150e; font-weight: 750; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        #message { min-height: 1.4em; margin-top: 14px; color: #ff988f; font-size: .9rem; }
        small { display: block; margin-top: 18px; color: #6f9185; line-height: 1.45; }
    </style>
</head>
<body>
<main>
    <h1>ROD do Cerrado</h1>
    <p>Painel administrativo do Raspberry Pi</p>
    <form id="login-form">
        <label for="username">Usuário</label>
        <input id="username" name="username" value="marcelo" autocomplete="username" required maxlength="80">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
        <button id="submit" type="submit">Entrar</button>
    </form>
    <div id="message" role="alert" aria-live="polite"></div>
    <small>Esta senha protege o painel e a API web. O Telegram continua protegido pela lista de usuário autorizado.</small>
</main>
<script>
    const form = document.getElementById('login-form');
    const submit = document.getElementById('submit');
    const message = document.getElementById('message');

    async function checkConfiguration() {
        const response = await fetch('/api/auth/status', { credentials: 'same-origin' });
        const status = await response.json();
        if (status.authenticated || !status.enabled) window.location.replace('/');
        if (!status.configured) {
            message.textContent = 'A proteção está ativa, mas as credenciais ainda não foram configuradas no Pi.';
            submit.disabled = true;
        }
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submit.disabled = true;
        message.textContent = '';
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.detail || `Falha HTTP ${response.status}`);
            window.location.replace('/');
        } catch (error) {
            message.textContent = error.message;
            submit.disabled = false;
        }
    });

    checkConfiguration().catch(() => { message.textContent = 'Não foi possível consultar o ROD.'; });
</script>
</body>
</html>
